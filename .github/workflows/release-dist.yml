name: Build frontend dist

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing BenchLedger release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build platform-independent frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run check

      - name: Pack deterministic dist archive
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="BenchLedger-${version}-dist.tar.gz"
          test -f dist/index.html
          mkdir -p build/release-dist
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C dist -cf - . \
            | gzip -n -9 > "build/release-dist/${asset}"
          (
            cd build/release-dist
            sha256sum "${asset}" > "${asset}.sha256"
          )

      - name: Upload frontend release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: build/release-dist/*
          if-no-files-found: error
          retention-days: 7
